name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m pytest -q
      - name: Offline end-to-end smoke
        run: python demo/offline/run_smoke.py --non-interactive
      - name: Validate and prepare live-demo fixture without API calls
        run: |
          python demo/live/validate_fixture.py
          python demo/live/prepare_live_demo.py --output /tmp/pma-live-demo-ci --update-output /tmp/pma-live-demo-update-ci.md
          test -z "$(git -C /tmp/pma-live-demo-ci status --short)"
      - name: Offline benchmark smoke
        run: |
          python benchmarks/run_benchmark.py --profile tiny --seed 20260830 --warmups 0 --repetitions 1 --output /tmp/pma-benchmark-smoke
      - name: Deterministic evals
        run: |
          python evals/scripts/run_query_memo_eval.py --mode fixture --output-root /tmp/pma-evals
          python evals/scripts/run_status_note_eval.py --output-root /tmp/pma-evals
          python evals/scripts/run_python_source_eval.py --output-root /tmp/pma-evals
          python evals/scripts/run_git_aware_state_eval.py --output-root /tmp/pma-evals
          python evals/scripts/run_reliability_eval.py --output-root /tmp/pma-evals

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m build --outdir dist
      - run: python evals/scripts/check_release_privacy.py src benchmarks demo docs README.md PROJECT_STATUS.md pyproject.toml MANIFEST.in LICENSE CHANGELOG.md dist
      - run: python evals/scripts/run_release_smoke.py
