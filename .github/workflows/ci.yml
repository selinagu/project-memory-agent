name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m pytest -q
      - name: Deterministic evals
        run: |
          python evals/scripts/run_query_memo_eval.py --mode fixture --output-root /tmp/pma-evals
          python evals/scripts/run_status_note_eval.py --output-root /tmp/pma-evals
          python evals/scripts/run_python_source_eval.py --output-root /tmp/pma-evals
          python evals/scripts/run_git_aware_state_eval.py --output-root /tmp/pma-evals
          python evals/scripts/run_reliability_eval.py --output-root /tmp/pma-evals

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m build --outdir dist
      - run: python evals/scripts/check_release_privacy.py src README.md pyproject.toml dist
      - run: python evals/scripts/run_release_smoke.py
